name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      
      - name: Construir etapa test backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr tests backend
        run: docker run --rm -e DATABASE_URL="sqlite:///./dummy.db" -v "${{ github.workspace }}/TestResults:/out" backend-test:ci

      - name: Login registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      
      - name: Construir etapa test frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr tests frontend
        run: docker run --rm -e COVERAGE_DIR=/salida/reporte -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Login registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: qa
    steps:
      - name: Desplegar en QA la IMAGEN del commit
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (QA)
        shell: bash
        env:
          URL_API: https://tp01-api-qa.onrender.com
          URL_FRONT: https://tp01-front-qa.onrender.com
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_API/pacientes/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde"
              exit 0
            fi
            sleep 20
          done
          echo "❌ QA falló"
          exit 1

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: ./frontend
      - name: Integracion contra API QA
        env:
          API_BASE_URL: https://tp01-api-qa.onrender.com
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend
      - name: Publicar reporte integracion
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: integracion
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install + Browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend
      - name: E2E contra QA
        env:
          E2E_BASE_URL: https://tp01-front-qa.onrender.com
        run: npx playwright test e2e/pacientes.spec.js
        working-directory: ./frontend
      - name: Publicar reporte E2E
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e
    environment: prod
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    steps:
      - name: Deploy de la MISMA imagen a PROD
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: https://tp01-api-prod.onrender.com
          URL_FRONT: https://tp01-front-prod.onrender.com
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_API/pacientes/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ PROD activo"
              exit 0
            fi
            sleep 20
          done
          echo "❌ PROD falló"
          exit 1